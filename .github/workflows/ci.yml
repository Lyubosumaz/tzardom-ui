name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Check LICENSE year
        run: node scripts/license-year.mjs

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check for a changeset
        if:
          github.event_name == 'pull_request' && github.head_ref !=
          'changeset-release/master'
        run: pnpm changeset status --since=origin/master

      - name: Build
        run: pnpm run build

      - name: Lint
        run: pnpm run lint

      - name: Test with coverage
        run: pnpm run test:coverage
