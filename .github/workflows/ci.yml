name: CI

on:
  pull_request:
    branches: ['release/*']
  workflow_call:

jobs:
  check:
    name: Code check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup

      - name: Build
        run: pnpm run build

      - name: Lint
        run: pnpm run lint

      - name: Unit tests
        run: pnpm run test:coverage
