name: Release

on:
  pull_request:
    branches: [master]

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  release:
    runs-on: ubuntu-latest
    steps:
      - name: Only release/* branches can merge into master
        if: "!startsWith(github.head_ref, 'release/')"
        run: exit 1

      - uses: actions/checkout@v4

      - uses: ./.github/actions/build

      - name: Check LICENSE year
        run: pnpm license && git diff --exit-code

      - name: Check changesets are versioned
        run: '! ls .changeset/*.md | grep -v README.md'

      - name: Install Playwright browsers
        run: pnpm --filter @tzardom-ui/core exec playwright install --with-deps

      - name: Test e2e
        run: pnpm run test:e2e
