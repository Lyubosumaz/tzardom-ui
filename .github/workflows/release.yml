name: Release

on:
  pull_request:
    branches: [master]

jobs:
  check:
    name: CI
    uses: ./.github/workflows/ci.yml

  release:
    runs-on: ubuntu-latest
    steps:
      - name: Only release/* branches can merge into master
        if: "!startsWith(github.head_ref, 'release/')"
        run: exit 1

      - uses: actions/checkout@v4

      - uses: ./.github/actions/build

      - name: Check the version is new on npm
        run: node scripts/check-version.mjs

      - name: Check LICENSE year
        run: pnpm license && git diff --exit-code
