name: Release

# CI + release checks. Runs on release PRs (release/* into master) and is
# reused by master.yml.
on:
  pull_request:
    branches: [master]
  workflow_call:

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  release:
    runs-on: ubuntu-latest
    steps:
      - name: Only release/* branches can merge into master
        if:
          github.event_name == 'pull_request' && !startsWith(github.head_ref,
          'release/')
        run: exit 1

      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check changesets are versioned
        run: '! ls .changeset/*.md | grep -v README.md'

      - name: Check LICENSE year
        run: pnpm license && git diff --exit-code

      - name: Build
        run: pnpm run build

      - name: Install Playwright browsers
        run: pnpm --filter @tzardom-ui/core exec playwright install --with-deps

      - name: Test e2e
        run: pnpm run test:e2e
