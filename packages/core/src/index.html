<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <title>tzardom-ui-core dev</title>
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=5.0"
    />
    <script type="module" src="/build/tzardom-ui-core.esm.js"></script>
    <script nomodule src="/build/tzardom-ui-core.js"></script>
  </head>
  <body style="font-family: sans-serif; padding: 2rem">
    <p>Click count: <span id="count">0</span></p>
    <p>Last theme reported: <span id="theme">(none yet)</span></p>

    <tzar-button label="Click me!"></tzar-button>

    <hr style="margin: 2rem 0" />

    <tzar-header></tzar-header>

    <script>
      let count = 0
      const btn = document.querySelector('tzar-button')
      btn.addEventListener('themeChange', (e) => {
        count += 1
        document.getElementById('count').textContent = String(count)
        document.getElementById('theme').textContent = e.detail
      })
    </script>
  </body>
</html>
