<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <title>tzardom-ui-core dev</title>
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=5.0"
    />
    <script type="module" src="/build/tzardom-ui-core.esm.js"></script>
    <script nomodule src="/build/tzardom-ui-core.js"></script>
  </head>
  <body style="font-family: sans-serif; padding: 2rem">
    <tzar-header></tzar-header>

    <hr style="margin: 2rem 0" />

    <p>Icon button clicks: <span id="icon-clicks">0</span></p>
    <tzar-icon-button label="Add">
      <svg
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        aria-hidden="true"
      >
        <path d="M12 5v14M5 12h14" />
      </svg>
    </tzar-icon-button>

    <script>
      let iconClicks = 0
      document
        .querySelector('tzar-icon-button')
        .addEventListener('click', () => {
          iconClicks += 1
          document.getElementById('icon-clicks').textContent =
            String(iconClicks)
        })
    </script>
  </body>
</html>
